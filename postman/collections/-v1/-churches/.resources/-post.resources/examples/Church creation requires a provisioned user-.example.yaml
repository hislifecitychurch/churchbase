$kind: http-example
name: Church creation requires a provisioned user
request:
  url: "{{host-api}}/v1/churches"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Example Church",
        "slug": "example-church"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "User has not been provisioned for Churchbase",
        "data": null,
        "filters": null,
        "errors": [
          {
            "code": "user_not_provisioned",
            "message": "User has not been provisioned for Churchbase"
          }
        ],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000025",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "church.create.user.not_provisioned",
          "user_id": null,
          "status": "warning"
        }
      }
order: 5000
