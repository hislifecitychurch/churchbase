$kind: http-example
name: Church slug already exists
request:
  url: "{{host-api}}/v1/churches"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Another Church",
        "slug": "example-church"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "A church with this slug already exists",
        "data": null,
        "filters": null,
        "errors": [
          {
            "code": "church_slug_conflict",
            "message": "A church with this slug already exists"
          }
        ],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000026",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "church.create.slug.conflict",
          "user_id": null,
          "status": "warning"
        }
      }
order: 6000
