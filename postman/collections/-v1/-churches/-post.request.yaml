$kind: http-request
name: POST /churches
description: Creates a church without creating users or memberships. Requires a valid BetterAuth session linked to a provisioned Churchbase Global Admin. Name and slug are required; timezone, website, bio, city, state_or_province, and country_code are optional. A supplied timezone must be an IANA time zone, website must use http or https, and country_code must be two letters. The response includes a derived profile_complete status requiring city, country code, and timezone; website and bio are optional, and state or province is reported but not included because its applicability varies by country. A slug already used by another church returns 409.
url: "{{host-api}}/v1/churches"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Example Church",
      "slug": "example-church",
      "timezone": "America/Chicago",
      "website": "https://example.org",
      "bio": "A welcoming church in Springfield.",
      "city": "Springfield",
      "state_or_province": "Illinois",
      "country_code": "US"
    }
auth:
  type: noauth
examples: ./.resources/-post.resources/examples
order: 2000
