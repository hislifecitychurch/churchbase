$kind: http-request
name: GET /churches
description: Returns all churches ordered by name, including active member and non-deleted ministry counts, profile details, and a derived profile_complete status. profile_complete requires city, country code, and timezone; website and bio are optional. State or province is reported but is not included because its applicability varies by country. Active member count includes only non-deleted users with active member-role church memberships. Requires a valid BetterAuth session linked to a provisioned Global Admin or Global Staff. Soft-deleted churches are omitted.
url: "{{host-api}}/v1/platform/churches"
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: noauth
examples: ./.resources/-get.resources/examples
order: 1000
