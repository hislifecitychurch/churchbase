$kind: http-request
name: POST /churches
description: Creates a church without creating users or memberships. Requires a valid BetterAuth session linked to a provisioned Churchbase Global Admin. Name and slug are required; timezone, website, and bio are optional. A supplied timezone must be an IANA time zone and website must use http or https. A slug already used by another church returns 409.
url: "{{host-api}}/v1/platform/churches"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Example Church",
      "slug": "example-church",
      "timezone": "America/Chicago",
      "website": "https://example.org",
      "bio": "A welcoming church in Springfield."
    }
auth:
  type: noauth
examples: ./.resources/-post.resources/examples
order: 2000
