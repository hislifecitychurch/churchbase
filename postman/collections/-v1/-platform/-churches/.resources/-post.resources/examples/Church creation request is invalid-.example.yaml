$kind: http-example
name: Church creation request is invalid
request:
  url: "{{host-api}}/v1/platform/churches"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": " ",
        "slug": "example-church"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Church name and slug are required",
        "data": null,
        "filters": null,
        "errors": [
          {
            "code": "invalid_church",
            "message": "Church name and slug are required"
          }
        ],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000022",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "church.create.invalid",
          "user_id": null,
          "status": "warning"
        }
      }
order: 2000
