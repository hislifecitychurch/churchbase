$kind: http-request
name: PUT /churches/:churchID
description: Updates a church's name and existing directory metadata. Replace the example UUID with the target church ID. The slug remains unchanged; blank optional fields clear their values, and country_code must be two letters. Requires a valid BetterAuth session linked to a provisioned Global Admin. A missing church returns 404.
url: "{{host-api}}/v1/platform/churches/018f47b8-8cb2-7d15-b28e-4a26843d81c2"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Example Church",
      "timezone": "America/Chicago",
      "website": "https://example.org",
      "bio": "A welcoming church in Springfield.",
      "city": "Springfield",
      "state_or_province": "Illinois",
      "country_code": "US"
    }
auth:
  type: noauth
examples: ./.resources/-put.resources/examples
order: 3000
