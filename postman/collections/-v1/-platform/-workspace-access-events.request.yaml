$kind: http-request
name: /workspace-access-events
description: Lists successful App and Platform workspace entries for all users. Requires a valid BetterAuth session and the admin platform role. Results are newest first and paginated; optional workspace filters by app or platform, and since/until accept RFC3339 timestamps. User names are included from the current Churchbase profile; credentials and session details are never returned.
url: "{{host-api}}/v1/platform/workspace-access-events?page=1&limit=25"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "25"
headers:
  Accept: application/json
auth:
  type: noauth
examples: ./.resources/-workspace-access-events.resources/examples
order: 1000
