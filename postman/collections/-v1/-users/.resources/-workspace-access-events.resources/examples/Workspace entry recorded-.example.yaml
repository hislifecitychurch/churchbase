$kind: http-example
name: Workspace entry recorded
request:
  url: "{{host-api}}/v1/users/me/workspace-access-events"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "workspace": "app",
        "entry_id": "018f47b8-8cb2-7d15-b28e-4a26843d81c1"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Workspace entry recorded",
        "data": {
          "id": "018f47b8-8cb2-7d15-b28e-4a26843d81c2",
          "workspace": "app",
          "occurred_at": "2026-01-01T00:00:00Z"
        },
        "filters": null,
        "errors": [],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000004",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "workspace_access_event.recorded",
          "user_id": "018f47b8-8cb2-7d15-b28e-4a26843d81c1",
          "status": "info"
        }
      }
order: 1000
