$kind: http-example
name: Invalid username credentials
request:
  url: "{{host-auth}}/v1/auth/sign-in/username"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "rememberMe": true
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Invalid username or password",
        "code": "INVALID_USERNAME_OR_PASSWORD"
      }
order: 2000
