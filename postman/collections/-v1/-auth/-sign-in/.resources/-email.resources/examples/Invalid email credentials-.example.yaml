$kind: http-example
name: Invalid email credentials
request:
  url: "{{host-auth}}/v1/auth/sign-in/email"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{email}}",
        "password": "{{password}}",
        "rememberMe": true
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Invalid email or password",
        "code": "INVALID_EMAIL_OR_PASSWORD"
      }
order: 2000
