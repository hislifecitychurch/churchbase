$kind: http-example
name: Authenticated identity has not been provisioned in Churchbase.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: GET
  headers:
    - key: churchbase.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "User has not been provisioned for Churchbase",
        "data": null,
        "filters": null,
        "errors": [
          {
            "code": "user_not_provisioned",
            "message": "User has not been provisioned for Churchbase"
          }
        ],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000006",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "me.user.not_provisioned",
          "user_id": null,
          "status": "warning"
        }
      }
order: 3000
