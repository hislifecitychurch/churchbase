$kind: http-example
name: Current Churchbase user and profile names.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: GET
  headers:
    - key: churchbase.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Current user retrieved",
        "data": {
          "id": "018f47b8-8cb2-7d15-b28e-4a26843d81c1",
          "platform_role": "admin",
          "profile": {
            "first_name": "Ada",
            "last_name": "Lovelace"
          }
        },
        "filters": null,
        "errors": [],
        "pagination": null,
        "metadata": {
          "request_id": "00000000-0000-4000-8000-000000000004",
          "timestamp": "2026-01-01T00:00:00Z"
        },
        "log": {
          "event": "me.retrieved",
          "user_id": "018f47b8-8cb2-7d15-b28e-4a26843d81c1",
          "status": "info"
        }
      }
order: 1000
