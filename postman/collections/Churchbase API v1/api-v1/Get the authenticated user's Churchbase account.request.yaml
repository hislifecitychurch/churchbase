$kind: http-request
description: Validates the BetterAuth session and resolves the separately stored Churchbase user and profile. Returns only the Churchbase user ID, platform role, and profile names; sensitive profile details are not exposed. The local BetterAuth sign-in endpoints are POST /api/v1/auth/sign-in/email and POST /api/v1/auth/sign-in/username on http://localhost:36081. BetterAuth uses the cookie churchbase.session_token in development and may use __Secure-churchbase.session_token with secure cookies. In Postman, sign in using the Authentication folder first; its cookie is stored in Postman's cookie jar and sent automatically to localhost:36080.
url: '{{baseUrl}}/api/v1/users/me'
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
settings: {}
examples: ./.resources/Get the authenticated user's Churchbase account.resources/examples
order: 2000
