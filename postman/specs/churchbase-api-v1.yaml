openapi: 3.1.0
info:
  title: Churchbase API v1
  version: 1.0.0
  description: >-
    Versioned Churchbase business API. BetterAuth owns identity and sessions;
    the API owns Churchbase users, profiles, and authorization. The local
    BetterAuth service listens at http://localhost:36081.
servers:
  - url: http://localhost:36080
    description: Local development API
tags:
  - name: Health
  - name: Users
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is alive
      description: Unauthenticated process liveness probe.
      responses:
        '200':
          description: API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
              example:
                success: true
                message: API is live
                data: { status: UP }
                filters: null
                errors: []
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000001
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: health.live
                  user_id: null
                  status: info
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      description: Unauthenticated readiness probe for PostgreSQL and Redis.
      responses:
        '200':
          description: API and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
              example:
                success: true
                message: API is ready
                data: { status: UP }
                filters: null
                errors: []
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000002
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: health.ready
                  user_id: null
                  status: info
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: API is not ready
                data: null
                filters: null
                errors:
                  - code: not_ready
                    message: A required dependency is unavailable
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000003
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: health.ready.failed
                  user_id: null
                  status: warning
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user's Churchbase account
      description: >-
        Validates the BetterAuth session and resolves the separately stored
        Churchbase user and profile. Returns only the Churchbase user ID,
        platform role, and profile names; sensitive profile details are not
        exposed. The local BetterAuth sign-in endpoints are
        POST /api/v1/auth/sign-in/email and POST /api/v1/auth/sign-in/username
        on http://localhost:36081. BetterAuth uses the cookie
        churchbase.session_token in development and may use
        __Secure-churchbase.session_token with secure cookies. In Postman,
        sign in using the Authentication folder first; its cookie is stored in
        Postman's cookie jar and sent automatically to localhost:36080.
      security:
        - BetterAuthSession: []
        - BetterAuthSecureSession: []
      responses:
        '200':
          description: Current Churchbase user and profile names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccess'
              example:
                success: true
                message: Current user retrieved
                data:
                  id: 018f47b8-8cb2-7d15-b28e-4a26843d81c1
                  platform_role: admin
                  profile:
                    first_name: Ada
                    last_name: Lovelace
                filters: null
                errors: []
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000004
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: me.retrieved
                  user_id: 018f47b8-8cb2-7d15-b28e-4a26843d81c1
                  status: info
        '401':
          description: Session is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Unauthorized
                data: null
                filters: null
                errors:
                  - code: unauthorized
                    message: Authentication is required
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000005
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: auth.unauthorized
                  user_id: null
                  status: warning
        '403':
          description: Authenticated identity has not been provisioned in Churchbase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: User has not been provisioned for Churchbase
                data: null
                filters: null
                errors:
                  - code: user_not_provisioned
                    message: User has not been provisioned for Churchbase
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000006
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: me.user.not_provisioned
                  user_id: null
                  status: warning
        '500':
          description: An unexpected API error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: BetterAuth is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Authentication service temporarily unavailable
                data: null
                filters: null
                errors:
                  - code: auth_unavailable
                    message: Authentication service temporarily unavailable
                pagination: null
                metadata:
                  request_id: 00000000-0000-4000-8000-000000000007
                  timestamp: '2026-01-01T00:00:00Z'
                log:
                  event: auth.service.unavailable
                  user_id: null
                  status: error
components:
  securitySchemes:
    BetterAuthSession:
      type: apiKey
      in: cookie
      name: churchbase.session_token
      description: BetterAuth session cookie in local development.
    BetterAuthSecureSession:
      type: apiKey
      in: cookie
      name: __Secure-churchbase.session_token
      description: BetterAuth session cookie when secure cookies are enabled.
  schemas:
    EnvelopeFields:
      type: object
      required: [message, filters, errors, pagination, metadata, log]
      properties:
        message:
          type: string
        filters:
          description: Reserved for endpoint filters; currently null.
          type: [object, 'null']
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        pagination:
          oneOf:
            - $ref: '#/components/schemas/Pagination'
            - type: 'null'
        metadata:
          $ref: '#/components/schemas/Metadata'
        log:
          $ref: '#/components/schemas/Log'
    HealthSuccess:
      allOf:
        - $ref: '#/components/schemas/EnvelopeFields'
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              $ref: '#/components/schemas/HealthStatus'
    CurrentUserSuccess:
      allOf:
        - $ref: '#/components/schemas/EnvelopeFields'
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              $ref: '#/components/schemas/CurrentUser'
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeFields'
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: false
            data:
              type: 'null'
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP
    CurrentUser:
      type: object
      required: [id, platform_role, profile]
      properties:
        id:
          type: string
          format: uuid
          description: Churchbase user ID, not the BetterAuth identity ID.
        platform_role:
          oneOf:
            - type: string
              enum: [admin, staff]
            - type: 'null'
        profile:
          $ref: '#/components/schemas/UserProfileNames'
    UserProfileNames:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Metadata:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: [string, 'null']
          format: uuid
        timestamp:
          type: string
          format: date-time
    Log:
      type: object
      required: [event, user_id, status]
      properties:
        event:
          type: string
        user_id:
          type: [string, 'null']
          description: Churchbase user ID when present; never a BetterAuth ID.
        status:
          type: string
          enum: [info, warning, error]
    Pagination:
      type: object
      required: [page, items, total, pages, limit, has_next, has_prev]
      properties:
        page:
          type: integer
        items:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        limit:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
